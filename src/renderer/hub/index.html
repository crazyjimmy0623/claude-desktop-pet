<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Deskmates</title>
  <style>
    html, body { margin: 0; height: 100%; background: #211e29; color: #ece8f4; overflow: hidden; user-select: none;
      font: 13px/1.4 "Microsoft JhengHei UI", "Microsoft JhengHei", "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; border: 1px solid #3d3749; box-sizing: border-box; }
    header { padding: 14px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
    header b { font-size: 16px; }
    header span { color: #a49cb4; margin-left: auto; }
    main { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 4px 10px 10px; }
    button { all: unset; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #2f2a3b; }
    button .ic { width: 20px; text-align: center; }
    button small { margin-left: auto; color: #a49cb4; }
    hr { border: 0; border-top: 1px solid #3d3749; margin: 4px 0; width: 100%; }
    #quit { color: #e38a84; }
  </style>
</head>
<body>
  <header><b>Deskmates</b><span id="stats"></span></header>
  <main>
    <button data-act="mode"><span class="ic" id="modeIc"></span><span id="modeText"></span></button>
    <button data-act="hide"><span class="ic">👀</span><span id="hideText"></span></button>
    <button data-act="focus"><span class="ic">🍅</span><span id="focusText"></span><small id="focusLeft"></small></button>
    <hr>
    <button data-act="guild"><span class="ic">📖</span>夥伴手冊<small>收集・招募・成就</small></button>
    <button data-act="settings"><span class="ic">⚙️</span>設定</button>
    <hr>
    <button data-act="quit" id="quit"><span class="ic">⏻</span>結束 Deskmates</button>
  </main>
  <script src="hub.js"></script>
</body>
</html>
