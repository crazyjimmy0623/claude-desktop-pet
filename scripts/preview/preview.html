<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#3b4a5a;font:11px sans-serif;color:#fff}
canvas{image-rendering:pixelated}
</style></head><body><canvas id="c"></canvas>
<script src="../../src/shared/sprites.js"></script>
<script src="../../src/shared/iso.js"></script>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'chars';
const c = document.getElementById('c'); const ctx = c.getContext('2d');
const U = 4, SW = Sprites.W * U, SH = Sprites.H * U;
if (mode === 'chars') {
  const skins = Object.keys(Sprites.SKINS);
  const poses = ['rest','walk','command','game','type','read','paint','wait','done','sleep','dangle','dance'];
  const accs = [null,'vr','partyhat','flower','glasses','sunglasses','headphones','halo','bow'];
  c.width = (poses.length + 2) * (SW + 6) + 70; c.height = skins.length * (SH + 8) * 2 + 10;
  ctx.fillStyle = '#3b4a5a'; ctx.fillRect(0,0,c.width,c.height);
  skins.forEach((sk, r) => {
    const col = Sprites.colorsFor(sk + 'x');
    for (let f = 0; f < 2; f++) {
      const y = (r * 2 + f) * (SH + 8) + 4;
      ctx.fillStyle = '#fff'; ctx.fillText(sk + ' f' + f, 2, y + 40);
      poses.forEach((p, i) => Sprites.drawCharacterAt(ctx, U, 70 + i * (SW + 6), y, sk, p, f, col, 1, { accessory: accs[(r + i) % accs.length] }));
      Sprites.drawCharacterAt(ctx, U, 70 + poses.length * (SW + 6), y, sk, 'rest', f, col, -1, {});
      Sprites.drawCharacterAt(ctx, U, 70 + (poses.length + 1) * (SW + 6), y, sk, 'type', f, col, 1, { prop: false });
    }
  });
} else if (mode === 'minis') {
  const skins = Object.keys(Sprites.SKINS);
  const poses = ['rest','walk','type','game','read','wait','done','sleep','dangle','dance'];
  const accs = [null,'vr','partyhat','flower','glasses','sunglasses','headphones','halo','bow'];
  const MU = 6, MW = Sprites.MINI.W * MU, MH = Sprites.MINI.H * MU;
  c.width = poses.length * (MW + 8) * 2 + 80; c.height = skins.length * (MH + 10) + 10;
  ctx.fillStyle = '#3b4a5a'; ctx.fillRect(0,0,c.width,c.height);
  skins.forEach((sk, r) => {
    const col = Sprites.colorsFor(r * 137);
    ctx.fillStyle = '#fff'; ctx.fillText(sk, 2, r * (MH + 10) + 40);
    poses.forEach((p, i) => [0, 1].forEach((f) => Sprites.drawMiniAt(ctx, MU, 70 + (i * 2 + f) * (MW + 8), r * (MH + 10) + 6, sk, p, f, col, 1, { accessory: f ? accs[(r + i) % accs.length] : null })));
  });
} else if (mode === 'anim') {
  // Every frame of the walk cycle and the idle breath, full size and room size.
  const skins = ['commander', 'droid', 'cat', 'astronaut'];
  const seq = [['walk', 4], ['rest', 8]];
  c.width = 12 * (SW + 6) + 70; c.height = skins.length * (SH + 8 + 18 * 6 + 8) + 10;
  ctx.fillStyle = '#3b4a5a'; ctx.fillRect(0,0,c.width,c.height);
  skins.forEach((sk, r) => {
    const y = r * (SH + 8 + 18 * 6 + 8) + 4;
    const col = Sprites.colorsFor(r * 137);
    let i = 0;
    for (const [p, n] of seq) for (let f = 0; f < n; f++, i++) {
      Sprites.drawCharacterAt(ctx, U, 70 + i * (SW + 6), y, sk, p, f, col, 1, {});
      Sprites.drawMiniAt(ctx, 6, 70 + i * (SW + 6) + 20, y + SH + 8, sk, p, f, col, 1, {});
    }
  });
} else if (mode === 'lineup') {
  // Every skin in a few poses at the room grid, no accessories or props: the art itself.
  const skins = Object.keys(Sprites.SKINS);
  const seq = [['rest', 0], ['walk', 0], ['walk', 1], ['walk', 2], ['walk', 3], ['type', 0], ['read', 0], ['done', 0], ['wait', 1], ['sleep', 0]];
  const MU = 6, MW = Sprites.MINI.W * MU, MH = Sprites.MINI.H * MU;
  c.width = seq.length * (MW + 6) + 80; c.height = skins.length * (MH + 6) + 6;
  ctx.fillStyle = '#3b4a5a'; ctx.fillRect(0,0,c.width,c.height);
  skins.forEach((sk, r) => {
    ctx.fillStyle = '#fff'; ctx.fillText(sk, 2, r * (MH + 6) + 60);
    seq.forEach(([p, f], i) => Sprites.drawMiniAt(ctx, MU, 80 + i * (MW + 6), r * (MH + 6) + 3, sk, p, f, Sprites.colorsFor(200), 1, {}));
  });
} else if (mode === 'fx') {
  c.width = 700; c.height = 140; ctx.fillStyle = '#3b4a5a'; ctx.fillRect(0,0,c.width,c.height);
  let x = 10; for (const k of Object.keys(Sprites.FX)) for (let f = 0; f < 2; f++) { Sprites.drawFxAt(ctx, 4, x, 20, k, f); x += Sprites.FX[k].w * 4 + 16; }
} else if (mode.startsWith('iso')) {
  // iso, iso12, iso20-rain: the hour and the weather to light the rooms with.
  const [, h, w] = mode.match(/^iso(\d+)?-?(\w+)?/);
  Iso.preview(c, 2, { hour: h ? +h : 20, weather: w || null });
}
document.title = 'ready';
</script></body></html>
